<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardik Mishra | Portfolio</title>
    
    <!-- AOS Animation CSS -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />

    <style>
        * {
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Screen load animation */
        body {
            background-color: #f8f9fa; 
            color: #333; 
            line-height: 1.6;
            animation: fadeIn 1.2s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container { max-width: 900px; margin: 0 auto; padding: 20px; }

        /* Hero Section */
        .hero { text-align: center; background: #ffffff; padding: 10px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .profile-img { width: 100%; max-width: 100%; height: auto; border-radius: 8px; border: none; display: block; margin: 0 auto 15px auto; }
        .hero h1 { font-size: 2.2rem; color: #1a1a1a; margin-bottom: 5px; }
        .hero h2 { font-size: 1.1rem; color: #0073b1; font-weight: 600; margin-bottom: 20px; }

        /* Section Styling */
        .section { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .section-title { font-size: 1.4rem; color: #1a1a1a; border-bottom: 2px solid #0073b1; padding-bottom: 8px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Skills Tags */
        .primary-skills { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
        .skill-tag-primary { background-color: #0073b1; color: white; padding: 8px 16px; border-radius: 20px; font-weight: 600; font-size: 0.9rem; }
        .other-skills-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .skill-tag-secondary { background-color: #eef3f8; color: #333; padding: 6px 14px; border-radius: 15px; font-size: 0.85rem; border: 1px solid #dcdcdc; }

        /* Projects Grid */
        .projects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
        .project-card { border: 1px solid #e0e0e0; padding: 20px; border-radius: 8px; background-color: #fafafa; transition: transform 0.2s ease; }
        .project-card:hover { transform: translateY(-3px); border-color: #0073b1; }

        /* Feature List */
        .feature-list { list-style-type: none; }
        .feature-list li { position: relative; padding-left: 25px; margin-bottom: 12px; }
        .feature-list li::before { content: "✔"; position: absolute; left: 0; color: #0073b1; font-weight: bold; }

        /* Resume Section */
        .resume-box { text-align: center; padding: 20px 0; }
        .btn-resume { display: inline-block; background-color: #0073b1; color: white; padding: 12px 28px; border-radius: 25px; text-decoration: none; font-weight: bold; margin-top: 15px; transition: background 0.3s; }
        .btn-resume:hover { background-color: #005582; }

        /* Contact Details */
        .contact-details { display: flex; flex-direction: column; gap: 15px; }
        .contact-item a { color: #0073b1; text-decoration: none; font-weight: 500; }
        .contact-item a:hover { text-decoration: underline; }
    </style>
</head>
